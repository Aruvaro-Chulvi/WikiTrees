# Publishes the web site (GitHub Pages) on every change to main: the viewer, the official trees and
# the approved community trees, built from community/ into trees/community/ (index.json, offlined/,
# online/, images/). Offlined reads trees/community/index.json to offer them for download.
# Only the maintainer merges into main, so only approved trees are ever published.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the site
        run: python3 community-kit/wikitrees_check.py site --out=_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
